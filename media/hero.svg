<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="timeglass-last30days Work Wrapped">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="55%" stop-color="#121526"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#3de0c5"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5d6c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-weight: 700; fill: #f4f1ea; }
      .sub { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-weight: 500; fill: #9aa3b5; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3de0c5; }
      .muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9aa3b5; }
      .cardt { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #f4f1ea; }
      .cardm { font-family: ui-sans-serif, system-ui, sans-serif; fill: #9aa3b5; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="180" cy="80" r="220" fill="#7C5CFF" opacity="0.22" filter="url(#blur)"/>
  <circle cx="1100" cy="120" r="200" fill="#3de0c5" opacity="0.16" filter="url(#blur)"/>
  <circle cx="900" cy="560" r="180" fill="#ff5d6c" opacity="0.12" filter="url(#blur)"/>

  <!-- hourglass mark -->
  <g transform="translate(88,72)">
    <rect x="0" y="0" width="72" height="72" rx="20" fill="url(#glow1)"/>
    <path d="M22 18h28c0 10-8 16-14 22 6 6 14 12 14 22H22c0-10 8-16 14-22-6-6-14-12-14-22z" fill="#0b0d14" opacity="0.9"/>
    <circle cx="36" cy="36" r="3.5" fill="#3de0c5"/>
  </g>

  <text x="180" y="108" class="mono" font-size="18">/timeglass-last30days</text>
  <text x="88" y="210" class="title" font-size="64">Work Wrapped</text>
  <text x="88" y="270" class="title" font-size="64">for your real month</text>
  <text x="88" y="330" class="sub" font-size="26">Last 30 days from Timeglass MCP. No scraping.</text>
  <text x="88" y="372" class="sub" font-size="26">Projects · meetings · billable mix · budget risk.</text>

  <!-- mini cards -->
  <g transform="translate(88,430)">
    <rect width="220" height="110" rx="22" fill="#141826" stroke="rgba(255,255,255,0.08)"/>
    <text x="22" y="42" class="cardm" font-size="14">Total time</text>
    <text x="22" y="82" class="cardt" font-size="34">157h</text>
  </g>
  <g transform="translate(328,430)">
    <rect width="220" height="110" rx="22" fill="#141826" stroke="rgba(255,255,255,0.08)"/>
    <text x="22" y="42" class="cardm" font-size="14">Billable</text>
    <text x="22" y="82" class="cardt" font-size="34">84%</text>
  </g>
  <g transform="translate(568,430)">
    <rect width="220" height="110" rx="22" fill="#141826" stroke="rgba(255,255,255,0.08)"/>
    <text x="22" y="42" class="cardm" font-size="14">Deep work</text>
    <text x="22" y="82" class="cardt" font-size="34">138h</text>
  </g>

  <!-- right panel -->
  <g transform="translate(820,150)">
    <rect width="380" height="360" rx="28" fill="#141826" stroke="rgba(255,255,255,0.08)"/>
    <text x="28" y="48" class="mono" font-size="14">TOP PROJECTS</text>
    <text x="28" y="100" class="cardt" font-size="20">Acme · website</text>
    <rect x="28" y="114" width="324" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="28" y="114" width="210" height="10" rx="5" fill="url(#glow1)"/>
    <text x="28" y="160" class="cardt" font-size="20">Beta · brand</text>
    <rect x="28" y="174" width="324" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="28" y="174" width="150" height="10" rx="5" fill="url(#glow1)"/>
    <text x="28" y="220" class="cardt" font-size="20">Nova · discovery</text>
    <rect x="28" y="234" width="324" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="28" y="234" width="100" height="10" rx="5" fill="url(#glow1)"/>
    <text x="28" y="300" class="muted" font-size="14">Identity: Billable Beast</text>
    <text x="28" y="328" class="muted" font-size="14">Identity: Deep Work Resident</text>
    <text x="28" y="370" class="mono" font-size="13">powered by timeglass.ai MCP</text>
  </g>
</svg>
