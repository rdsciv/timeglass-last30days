<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="Work Wrapped — your last 30 days from Timeglass MCP." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
/* Hallmark · studied-DNA (source: timeglass.ai) · paper cream · ink forest · accent teal
 * Macrostructure: product report · Nav: none (artifact) · Footer: quiet credit
 */
:root {
  --paper: #f4f1ea;
  --paper-2: #ebe6db;
  --paper-3: #ffffff;
  --ink: #14201a;
  --ink-soft: #3d4a43;
  --muted: #6b756f;
  --line: #ddd6c8;
  --line-soft: #e8e2d6;
  --forest: #1a2c24;
  --forest-2: #243830;
  --teal: #1f8a7a;
  --teal-deep: #17695c;
  --amber: #c9852a;
  --amber-soft: #f3e2c4;
  --rose: #b54a4a;
  --good: #2f7d55;
  --shadow: 0 18px 40px rgba(20, 32, 26, 0.08);
  --radius: 14px;
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-display: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", serif;
  --measure: 68ch;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-feature-settings: "ss01" on, "cv11" on;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
body {
  min-height: 100vh;
  background:
    radial-gradient(900px 420px at 100% 0%, rgba(31, 138, 122, 0.07), transparent 55%),
    var(--paper);
}

.page {
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 20px 72px;
}

/* Masthead */
.masthead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.mark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--forest);
  color: var(--paper);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.78rem;
  letter-spacing: 0.02em;
}
.brand-text strong {
  display: block;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.brand-text span {
  display: block;
  color: var(--muted);
  font-size: 0.82rem;
  margin-top: 2px;
}
.pill {
  font-size: 0.78rem;
  color: var(--ink-soft);
  background: var(--paper-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 12px;
  white-space: nowrap;
}

/* Hero band — forest statement, Timeglass marketing voice */
.hero {
  background: var(--forest);
  color: #f7f4ee;
  border-radius: 22px;
  padding: 36px 32px 30px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: -80px;
  top: -80px;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(31, 138, 122, 0.28), transparent 65%);
  pointer-events: none;
}
.kicker {
  margin: 0 0 14px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(247, 244, 238, 0.62);
}
.hero h1 {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-style: normal;
  font-weight: 600;
  font-size: clamp(2.35rem, 5.4vw, 3.55rem);
  line-height: 1.05;
  letter-spacing: -0.03em;
  max-width: 14ch;
  overflow-wrap: anywhere;
}
.hero .lede {
  margin: 0 0 26px;
  max-width: 42ch;
  color: rgba(247, 244, 238, 0.78);
  font-size: 1.02rem;
  line-height: 1.5;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
@media (max-width: 720px) {
  .hero { padding: 28px 20px 22px; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.metric {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 14px 14px 12px;
}
.metric .label {
  color: rgba(247, 244, 238, 0.58);
  font-size: 0.75rem;
  margin-bottom: 6px;
  font-weight: 500;
}
.metric .value {
  font-size: 1.45rem;
  font-weight: 650;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

/* Layout */
.grid-2 {
  display: grid;
  grid-template-columns: 1.25fr 0.9fr;
  gap: 14px;
  margin-bottom: 14px;
}
@media (max-width: 840px) {
  .grid-2 { grid-template-columns: 1fr; }
}
.card {
  background: var(--paper-3);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 20px 16px;
  box-shadow: 0 1px 0 rgba(20, 32, 26, 0.03);
}
.card h2 {
  margin: 0 0 16px;
  font-size: 0.92rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 11px 0;
  border-top: 1px solid var(--line-soft);
}
.row:first-of-type { border-top: 0; padding-top: 0; }
.name {
  font-size: 0.94rem;
  font-weight: 550;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.meta {
  color: var(--muted);
  font-size: 0.78rem;
  margin-top: 3px;
  line-height: 1.35;
}
.hours {
  font-size: 0.86rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
  font-weight: 500;
  padding-top: 2px;
}
.track {
  height: 6px;
  background: var(--paper-2);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 9px;
}
.fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--teal-deep), var(--teal));
}

/* Identity — quiet product cards, not neon chips */
.identity-list {
  display: grid;
  gap: 10px;
}
.idcard {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 12px;
  padding: 14px 14px 13px;
}
.idcard strong {
  display: block;
  font-size: 0.92rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.idcard span {
  color: var(--muted);
  font-size: 0.86rem;
  line-height: 1.4;
}

/* Rhythm chart */
.chart-card { margin-bottom: 14px; }
.chart {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  height: 128px;
  padding-top: 8px;
}
.bar {
  flex: 1;
  min-width: 0;
  border-radius: 5px 5px 2px 2px;
  background: var(--teal);
  opacity: 0.92;
}
.bar:nth-child(3n) { background: #2aa394; }
.bar:nth-child(4n) { background: #178072; }
.bar.zero {
  background: var(--paper-2);
  height: 4px !important;
  opacity: 1;
}

/* Bottom grid */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-soft);
  font-size: 0.8rem;
  padding: 8px 11px;
  line-height: 1.2;
}
.chip.warn {
  border-color: #e4c48a;
  background: var(--amber-soft);
  color: #7a4e12;
}
.chip.danger {
  border-color: #e2b4b4;
  background: #f8e8e8;
  color: var(--rose);
}

.footer {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 0.82rem;
}
.footer a {
  color: var(--teal-deep);
  text-decoration: none;
  font-weight: 500;
}
.footer a:hover { text-decoration: underline; }

.empty {
  color: var(--muted);
  font-size: 0.9rem;
  padding: 4px 0 8px;
}
</style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <div class="mark" aria-hidden="true">TG</div>
        <div class="brand-text">
          <strong>Work Wrapped</strong>
          <span>Last 30 days · Timeglass MCP</span>
        </div>
      </div>
      <div class="pill" id="window">{{WINDOW}}</div>
    </header>

    <section class="hero" aria-labelledby="headline">
      <p class="kicker">Monthly review</p>
      <h1 id="headline">Loading…</h1>
      <p class="lede" id="oneliner"></p>
      <div class="metrics" id="metrics"></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>Where the month went</h2>
        <div id="projects"></div>
      </section>
      <section class="card">
        <h2>How the month reads</h2>
        <div class="identity-list" id="identity"></div>
      </section>
    </div>

    <section class="card chart-card">
      <h2>Daily rhythm</h2>
      <div class="chart" id="chart" role="img" aria-label="Daily hours chart"></div>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>Top activities</h2>
        <div id="activities"></div>
      </section>
      <section class="card">
        <h2>Notes &amp; budget</h2>
        <div class="chips" id="chips"></div>
      </section>
    </div>

    <footer class="footer">
      <div>Built with <a href="https://timeglass.ai" target="_blank" rel="noreferrer">Timeglass</a> · no scraping · your work record only</div>
      <div id="source"></div>
    </footer>
  </div>

<script id="stats" type="application/json">{{STATS_JSON}}</script>
<script>
(function () {
  const stats = JSON.parse(document.getElementById('stats').textContent);
  const $ = (id) => document.getElementById(id);
  const fmtH = (m) => {
    const h = m / 60;
    if (h >= 10) return Math.round(h) + 'h';
    if (h >= 1) return (Math.round(h * 10) / 10) + 'h';
    return m + 'm';
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));

  $('headline').textContent = stats.headline || ((stats.total_hours || 0) + 'h this month');
  $('oneliner').textContent = stats.one_liner || '';
  $('window').textContent = (stats.window_start || '') + ' → ' + (stats.window_end || '');
  $('source').textContent = 'source: ' + (stats.source || 'unknown') + (stats.user ? ' · ' + stats.user : '');

  const metrics = [
    ['Total', (stats.total_hours ?? '—') + 'h'],
    ['Active days', String(stats.active_days ?? '—')],
    ['Billable', (stats.billable_pct ?? 0) + '%'],
    ['Meetings', (stats.meeting_pct ?? 0) + '%'],
  ];
  $('metrics').innerHTML = metrics.map(([label, value]) =>
    `<div class="metric"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`
  ).join('');

  const projects = stats.top_projects || [];
  $('projects').innerHTML = projects.slice(0, 6).map((p) => `
    <div class="row">
      <div>
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${esc(p.client || '')}${p.budget_used_pct != null ? ' · ' + p.budget_used_pct + '% of budget' : ''}</div>
        <div class="track"><div class="fill" style="width:${Math.min(100, p.share_pct || 0)}%"></div></div>
      </div>
      <div class="hours">${esc(String(p.hours))}h</div>
    </div>
  `).join('') || '<div class="empty">No project rows in this window.</div>';

  const cards = stats.identity_cards || [];
  $('identity').innerHTML = cards.map((c) => `
    <div class="idcard"><strong>${esc(c.title)}</strong><span>${esc(c.blurb)}</span></div>
  `).join('') || '<div class="empty">No identity cards.</div>';

  const acts = stats.top_activities || [];
  $('activities').innerHTML = acts.slice(0, 8).map((a) => `
    <div class="row">
      <div>
        <div class="name">${esc(a.title)}</div>
        <div class="meta">${esc(a.project || '')}</div>
      </div>
      <div class="hours">${esc(fmtH(a.minutes || 0))}</div>
    </div>
  `).join('') || '<div class="empty">No activities.</div>';

  const series = stats.daily_series || [];
  const maxM = Math.max(1, ...series.map((d) => d.minutes || 0));
  $('chart').innerHTML = series.map((d) => {
    const h = Math.max(4, Math.round(((d.minutes || 0) / maxM) * 120));
    const z = (d.minutes || 0) === 0 ? ' zero' : '';
    return `<div class="bar${z}" style="height:${h}px" title="${esc(d.date)}: ${esc(fmtH(d.minutes || 0))}"></div>`;
  }).join('');

  const chips = [];
  (stats.shoutouts || []).forEach((s) => chips.push({ t: s, c: '' }));
  (stats.budget_alerts || []).forEach((b) => chips.push({
    t: `${b.level === 'over' ? 'Over budget' : 'Near budget'} · ${b.name} · ${b.budget_used_pct}%`,
    c: b.level === 'over' ? 'danger' : 'warn'
  }));
  (stats.top_apps || []).slice(0, 4).forEach((a) => chips.push({ t: `${a.name} · ${fmtH(a.minutes)}`, c: '' }));
  $('chips').innerHTML = chips.map((c) => `<span class="chip ${c.c}">${esc(c.t)}</span>`).join('')
    || '<span class="chip">No notes yet</span>';
})();
</script>
</body>
</html>
